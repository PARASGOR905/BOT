[build-system]
requires = ['poetry-core>=1.0.0']
build-backend = 'poetry.core.masonry.api'

[tool.poetry]
name = 'vinetrimmer'
version = '0.1.0'
description = 'Playready and Widevine DRM downloader and decrypter'
authors = []
packages = [
    { include = "vinetrimmer" },
    { include = "stage_dl.py", from = "Standalone" }
]

[tool.poetry.dependencies]
subby = {path = "./scripts/subby", develop = true}
pyplayready = {path = "./scripts/pyplayready", develop = true}
python = "^3.10"
appdirs = "^1.4.4"
aiohttp = {version = "^3.9.1", optional = true}
beautifulsoup4 = "~4.11.2"
click = "^8.1.3"
cffi = "^1.16.0"
curl-cffi = "^0.14.0"
coloredlogs = "^15.0"
construct = ">=2.8.8"
platformdirs = "4.10.0"
crccheck = "^1.0"
cryptography = "^45.0.6"
ecpy = "^1.2.5"
httpx = "^0.23.0"
isodate = "^0.6.1"
jsonpickle = "^2.0.0"
langcodes = { extras = ["data"], version = "^3.4.0" }
language-data = "1.2.0"
lxml = "^5.3.0"
m3u8 = "^6.0.0"
marisa-trie = "^1.1.0"
pproxy = "^2.7.7"
protobuf = ">=3.13.0"
pycaption = "^2.1.1"
pycryptodome = "^3.21.0"
pycryptodomex = "^3.4.3"
pycountry = "^24.6.1"
pyhulu = "^1.1.2"
pymediainfo = ">=5.0.3"

PyMySQL = { extras = ["rsa"], version = "^1.0.2" }
pysubs2 = "^1.6.1"
PyYAML = "^6.0.1"
charset-normalizer = ">=3.0.0,<4"
chardet = ">=3.0.2,<6"
ruamel-yaml = "^0.18.10"
setuptools = "<81"
tldextract = "^3.1.0"
toml = "^0.10.2"
tqdm = "^4.67.1"
Unidecode = "^1.2.0"
requests = { extras = ["socks"], version = ">=2.32.3" }
urllib3 = ">=2.0.0,<3"
validators = "^0.18.2"
websocket-client = "^1.1.0"
xmltodict = "^0.14.2"
yt-dlp = "^2022.11.11"
selenium = "^4.45.0"
playwright = "^1.61.0"
pywidevine = { git = "https://github.com/devine-dl/pywidevine.git" }

[tool.poetry.group.dev.dependencies]
flake8 = "^3.8.4"
isort = "^5.9.2"
pyinstaller = "^4.4"

[tool.poetry.scripts]
vt = 'vinetrimmer.vinetrimmer:main'
stage-dl = 'stage_dl:main'
stage_dl = 'stage_dl:main'

[tool.isort]
line_length = 120
classes = ['CTV', 'FPS', 'IO', 'iTunes', 'MP4', 'TVNOW']
extend_skip = ['vinetrimmer/vendor']
